// Lyd lagres som en liten data-URL. Korte opptak holder filen liten.
function fileAsDataURL(blob) {
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=()=>reject(new Error('Kunne ikke lese lydfilen.'));
    reader.readAsDataURL(blob);
  });
}
async function saveRecording(key,blob) {
  key=normalizedAudioKey(key);
  if(!key){toast('Skriv bokstaven eller ordet først.');return;}
  if(key.length>45){toast('Velg et kort ord eller en bokstav.');return;}
  if(!blob || blob.size>270*1024){toast('Lydfilen er for stor. Ta opp et kortere klipp (maks 270 KB).');return;}
  if(Object.keys(state.recordings).length>=24 && !state.recordings[key]){toast('Du har allerede 24 opptak. Fjern et gammelt først.');return;}
  try {
    const data=await fileAsDataURL(blob);
    if(!data.startsWith('data:audio/')){toast('Velg en lydfil.');return;}
    const previous=state.recordings[key];
    state.recordings[key]={data,created:Date.now()};
    if(!saveState()){
      if(previous)state.recordings[key]=previous;else delete state.recordings[key];
      return;
    }
    if(ui.screen==='teacher')render();
    toast(`Egen uttale for ${key} er lagret! 🎙️`);
  }catch(err){toast(err.message || 'Kunne ikke lagre lydklippet.');}
}
function setRecordStatus(message) {
  setFeedback('#record-status',message);
}
async function toggleRecording() {
  if(ui.recorder && ui.recorder.state==='recording'){stopRecording();return;}
  const key=normalizedAudioKey(document.querySelector('#record-key')?.value);
  if(!key){toast('Skriv for eksempel Y før du tar opp.');return;}
  if(!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
    toast('Mikrofonopptak støttes ikke her. Du kan velge en lydfil.');return;
  }
  try {
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const types=['audio/webm;codecs=opus','audio/mp4','audio/webm'];
    const mimeType=types.find(type=>MediaRecorder.isTypeSupported(type));
    const recorder=new MediaRecorder(stream,mimeType?{mimeType}:undefined);
    ui.recordStream=stream;ui.recorder=recorder;ui.recordChunks=[];
    recorder.ondataavailable=e=>{if(e.data.size)ui.recordChunks.push(e.data);};
    recorder.onerror=()=>setRecordStatus('Opptaket mislyktes. Prøv eventuelt en lydfil.');
    recorder.onstop=async()=>{
      const blob=new Blob(ui.recordChunks,{type:recorder.mimeType || 'audio/webm'});
      stream.getTracks().forEach(track=>track.stop());
      ui.recordStream=null;ui.recorder=null;
      if(blob.size>0) await saveRecording(key,blob);
      else setRecordStatus('Det ble ikke noe lydopptak.');
    };
    recorder.start();
    const btn=document.querySelector('#record-button');
    if(btn)btn.textContent='■ Stopp opptak';
    setRecordStatus(`Tar opp ${key} … si lyden tydelig. (Maks 4 sekunder)`);
    setTimeout(()=>{if(ui.recorder===recorder && recorder.state==='recording')stopRecording();},4000);
  }catch(err){
    console.warn('Mikrofon:',err);
    toast('Mikrofonen er ikke tilgjengelig. Prøv HTTPS eller velg lydfil.');
  }
}
function stopRecording() {
  const recorder=ui.recorder;
  if(recorder && recorder.state==='recording')recorder.stop();
  const btn=document.querySelector('#record-button');if(btn)btn.textContent='🎙️ Ta opp';
}
function deleteRecording(key) {
  if(!state.recordings[key])return;

}
function backupDownload() {

async function backupImport(file) {
  try {
    if(file.size>14*1024*1024)throw new Error('Filen er for stor.');
    const value=JSON.parse(await file.text());
    if(value.format!=='ordoya-backup' || value.version!==1 || !value.data || !Array.isArray(value.data.books))
      throw new Error('Dette er ikke en sikkerhetskopi fra Ordøya.');
    if(!confirm('Vil du erstatte alt innhold på denne enheten med sikkerhetskopien?'))return;
    const previous=state;
    state={...newState(),...value.data,settings:{...newState().settings,...value.data.settings},
      creatures:normalizeCreatures(value.data.creatures),
      mastery:{streak:Math.max(0,Math.min(6,Number(value.data.mastery?.streak)||0))},
      sessions:{...newState().sessions,...value.data.sessions},
      waterWords:Array.isArray(value.data.waterWords)?value.data.waterWords:[],
      waterSentences:Array.isArray(value.data.waterSentences)?value.data.waterSentences:[],
      pronunciationHints:value.data.pronunciationHints && typeof value.data.pronunciationHints==='object' && !Array.isArray(value.data.pronunciationHints)?value.data.pronunciationHints:{}};
    if(!saveState()){state=previous;return;}
    goTo('home');toast('Sikkerhetskopien er lagt inn!');
  }catch(err){toast(err.message||'Kunne ikke lese sikkerhetskopien.');}
}

    case 'go-lab':goTo('lab');break;
    case 'go-letter-sort':goTo('letter-sort');break;
    case 'go-alphabet-letters':goTo('alphabet-letters');break;
    case 'go-alphabet-words':goTo('alphabet-words');break;
    case 'sort-pick':sortPick(index);break;
    case 'sort-bin':sortBin(button.dataset.bin);break;
    case 'sort-choose':sortChoose(index);break;
    case 'sort-undo':sortUndo();break;
    case 'sort-check':sortCheck();break;
    case 'sort-hint':sortHint();break;
    case 'sort-hear':sortHear(index);break;
    case 'sort-next':nextSortTask();break;
    case 'go-word-shelf':goTo('word-shelf');break;
    case 'go-sentences':goTo('sentences');break;
    case 'go-dinos':goTo('dinos');break;
    case 'dino-reveal':revealDino();break;
    case 'reveal-back':goTo(ui.revealReturn==='dino-reveal'?'home':ui.revealReturn);break;
    case 'dino-play':animateDino(button.dataset.id,button);break;
    case 'go-build':goTo('build');break;
    case 'go-shelf':goTo('shelf');break;
    case 'go-hunt':goTo('hunt');break;
    case 'open-garden':goTo('garden');break;
    case 'surprise':goTo(pick(['water','build','hunt','garden','letter-sort','alphabet-letters','alphabet-words']));break;
    case 'home-hear':speak('Du kan sprute på bokstaver, bygge ord, lage en bok eller finne ord. Du kan bytte når du vil.');break;

    // Bokstavblink
    case 'hit-target':
      // Vanlige pekertreff fanges av pointerdown nedenfor.
      // Tastatur og skjermleser gir klikk med detail = 0.
      if(evt.detail===0)hitWaterTarget(button.dataset.id);
      break;
    case 'water-builder-toggle':ui.waterBuilderOpen=!ui.waterBuilderOpen;updateWaterSidebar();break;
    case 'water-add':waterAddLetter(index);break;
    case 'water-undo':ui.waterBuild.pop();updateWaterSidebar();break;
    case 'water-read':speakWord(ui.waterBuild.map(i=>state.waterBag[i]).join(''));break;
    case 'water-save':waterSaveWord();break;
    // Fra vannleken til den varige ordhylla. Trykk på et ord for opplesning.
    case 'shelf-hear-word':speakWord(button.dataset.word);break;
    case 'sentence-add':sentenceAdd(button.dataset.word);break;
    case 'sentence-more':ui.showAllSentenceWords=!ui.showAllSentenceWords;render();break;
    case 'sentence-remove':ui.sentenceDraft.splice(index,1);render();break;
    case 'sentence-undo':ui.sentenceDraft.pop();render();break;
    case 'sentence-hear':speak(sentenceText(ui.sentenceDraft));break;
    case 'sentence-save':sentenceSave();break;
    case 'sentence-read-saved':speak(button.dataset.sentence);break;

    // Ordbygger
    case 'build-add':buildAdd(index);break;
    case 'build-remove':ui.buildTask.chosen.splice(index,1);render();break;
    case 'build-check':buildCheck();break;
    case 'build-hint':buildHint();break;
    case 'build-hear':ui.buildTask.participated=true;speakWord(ui.buildTask.data.word);break;
    case 'build-next':nextActivity('build');break;

    // Ordjakt
    case 'hunt-choice':huntChoose(button.dataset.word);break;
    case 'hunt-hear':ui.huntTask.participated=true;speakWord(ui.huntTask.data.word);break;
    case 'hunt-hint':huntHint();break;
    case 'hunt-next':nextActivity('hunt');break;

    // Bokstavhagen
    case 'garden-choice':gardenChoose(button.dataset.letter);break;
    case 'garden-hear':ui.gardenTask.participated=true;speak(ui.gardenTask.letter);break;
    case 'garden-next':nextActivity('garden');break;
    case 'success-hear':speakWord(button.dataset.word);break;

    // LydBoka
    case 'book-new':newBook();break;
    case 'book-open':ui.bookId=button.dataset.id;ui.pageIndex=0;goTo('writer');break;
    case 'book-shelf':goTo('shelf');break;
    case 'writer-prev':ui.pageIndex--;render();break;
    case 'writer-next':ui.pageIndex++;render();break;
    case 'writer-add-page':writerAddPage();break;
    case 'writer-delete-page':writerRemovePage();break;
    case 'writer-delete-book':writerDeleteBook();break;
    case 'writer-remove-photo':{
      const b=getBook();if(b){b.pages[ui.pageIndex].image='';saveState();render();}break;
    }
    case 'writer-download':writerDownload();break;
    case 'writer-hear':{
      const b=getBook();if(b)speak(b.pages[ui.pageIndex].text||b.title);break;
    }
    case 'writer-sticker':writerChangeSticker(button.dataset.sticker);break;
    case 'writer-sticker-focus':document.querySelector('.sticker-picker')?.scrollIntoView({behavior:'smooth',block:'center'});break;

    // Lærerhjørnet
    case 'teacher-test-y':speak('Y');break;
    case 'teacher-test-lys':speakWord('lys');break;
    case 'teacher-pron-test':speakWord(teacherPronWord());break;
    case 'teacher-pron-plain':speak(teacherPronWord().toLocaleLowerCase('nb-NO'));break;
    case 'teacher-pron-context':{const w=teacherPronWord().toLocaleLowerCase('nb-NO');if(w)speak(`Jeg sier ordet ${w}.`);break;}
    case 'teacher-pron-preview':previewPronHint();break;
    case 'teacher-pron-save':savePronHint();break;
    case 'teacher-pron-delete':deletePronHint(button.dataset.key);break;
    case 'teacher-pron-record':{const field=document.querySelector('#record-key');if(field){field.value=teacherPronWord();field.scrollIntoView({behavior:'smooth',block:'center'});field.focus();}break;}
    case 'record-toggle':toggleRecording();break;
    case 'record-test-current':{
      const key=document.querySelector('#record-key')?.value;
      if(!key?.trim())toast('Skriv for eksempel Y først.');else speak(key);break;
    }
    case 'record-play':speak(button.dataset.key);break;
    case 'record-delete':deleteRecording(button.dataset.key);break;
    case 'backup-download':backupDownload();break;
    case 'teacher-reset':teacherReset();break;
  }
});

// Vann treffer akkurat der eleven trykker – det finnes ingen ammunisjonsmåler.
app.addEventListener('pointerdown',(evt)=>{
  if(ui.screen==='water' && evt.target.closest('#water-stage'))waterFire(evt);
});
app.addEventListener('pointermove',(evt)=>{
  if(ui.screen==='water' && evt.target.closest('#water-stage'))aimWaterGun(evt);
});

// Skrivefelt lagrer ved hver endring, uten at vi tegner siden på nytt.
app.addEventListener('input',(evt)=>{
  if(evt.target.matches('[data-writer]'))writerInput(evt.target);
  if(evt.target.matches('#teacher-rate')){
    state.settings.speechRate=Number(evt.target.value);
    setFeedback('#teacher-rate-display',Math.round(state.settings.speechRate*100)+' %');
    saveState();
  }
});

app.addEventListener('change',async(evt)=>{
  const el=evt.target;
  if(el.matches('[data-setting]')){
    const key=el.dataset.setting;
    state.settings[key]=el.type==='checkbox'?el.checked:
      key==='level'?Number(el.value):key==='speechRate'?Number(el.value):el.value;
    // Nye nivåvalg skal gi nye oppgaver neste gang eleven åpner en lek.
    if(key==='level'){
      ui.buildTask=null;ui.huntTask=null;ui.sortTask=null;
      state.mastery.streak=0;
    }
    if(key==='automatic' && !el.checked)state.mastery.streak=0;
    saveState();updateMotion();
    if(key==='level' && ['build','hunt','letter-sort','alphabet-letters','alphabet-words'].includes(ui.screen))goTo(ui.screen);
  }
  if(el.id==='writer-photo-input' && el.files?.[0]){
    await writerPhoto(el.files[0]);el.value='';
  }
  if(el.id==='record-file' && el.files?.[0]){
    const key=document.querySelector('#record-key')?.value||'';
    if(!key.trim())toast('Skriv en bokstav eller et ord først.');
    else await saveRecording(key,el.files[0]);
    el.value='';
  }
  if(el.id==='backup-file' && el.files?.[0]){
    await backupImport(el.files[0]);el.value='';
  }
});

// Enkel tastatursnarvei for voksne: Escape går tilbake.
// Vi gjør ikke dette mens noen skriver i et felt eller tar opp lyd.
window.addEventListener('keydown',(evt)=>{
  if(evt.key!=='Escape')return;
  if(evt.target.matches('input,textarea,select') || ui.recorder?.state==='recording')return;
  if(ui.screen==='writer')goTo('shelf');
  else if(ui.screen==='sentences')goTo('word-shelf');
  else if(ui.screen==='dino-reveal')goTo(ui.revealReturn);
  else if(ui.screen!=='home')goTo('home');
});

// Vis første skjerm. Ingen konto, ingen intro som må klikkes bort.
render();

</script>
</body>
</html>
