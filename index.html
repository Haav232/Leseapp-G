    VELKOMMEN TIL ORDØYA!

  <style>
/*
  ORDØYA – UTSEENDE
  ------------------
  1. Fargene og de vanligste størrelsene kan justeres i :root.
  2. Alle interaktive felt er store nok til å kunne trykkes på med fingeren.
  3. Aktivitetene er laget uten tidsbegrensninger og uten røde feilsymboler.
  4. Prefers-reduced-motion og «Rolige bevegelser» slår av unødvendig animasjon.
*/
:root {
  --ink: #25394b;
  --ink-soft: #677686;
  --paper: #fbf8f0;
  --surface: #ffffff;
  --line: #e7e7e3;
  --coral: #f17369;
  --coral-soft: #fff0e9;
  --blue: #5c85e2;
  --blue-soft: #e8efff;
  --mint: #74b9a4;
  --mint-soft: #e4f7ed;
  --sun: #f5c965;
  --sun-soft: #fff2d1;
  --lilac: #aa92d8;
  --lilac-soft: #f1e9fe;
  --radius: 26px;
  --shadow: 0 8px 22px rgba(45, 70, 84, .07), 0 1px 3px rgba(45, 70, 84, .05);
  --font: ui-rounded, "Trebuchet MS", "Arial Rounded MT Bold", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  min-height: 100vh; margin: 0; display: flex; flex-direction: column;
  color: var(--ink); background: var(--paper); font-family: var(--font);
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .43; cursor: not-allowed; }
button, input, textarea, select { touch-action: manipulation; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible,
summary:focus-visible { outline: 4px solid #d3a42f; outline-offset: 3px; }
[hidden] { display: none !important; }
.skip-link { position: absolute; top: -90px; left: 15px; padding: 12px 18px; z-index: 999; background: var(--ink); color: white; border-radius: 12px; }
.skip-link:focus { top: 8px; }

.site-header, .site-footer { width: min(1220px, 100%); margin-inline: auto; }
.site-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 24px clamp(18px,4vw,48px) 8px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0; color: var(--ink); border: 0; background: transparent; }
.brand-mark { width: 46px; height: 46px; position: relative; display: inline-grid; place-items: center; border-radius: 17px 17px 14px 17px; background: #ffce85; transform: rotate(-9deg); box-shadow: inset -4px -4px 0 #f5b967; }
.brand-mark span:first-child { font-size: 28px; font-weight: 1000; color: #345d63; transform: rotate(9deg); }
.brand-mark span:last-child { position: absolute; right: -6px; bottom: -3px; transform: rotate(15deg); font-size: 19px; font-weight: 900; color: white; background: var(--coral); padding: 0 5px; border-radius: 9px; }
.brand-text { font-size: clamp(24px,3vw,31px); font-weight: 1000; letter-spacing: -1.7px; }
.brand-dot { color: var(--coral); }
.header-right { display: flex; align-items: center; gap: 28px; }
.header-note { color: #83908c; font-size: 13px; font-weight: 700; }
.header-note span { color: var(--mint); }
.adult-link { border: 1px solid #e3e0d9; border-radius: 50px; background: #fffdf7; padding: 11px 15px; color: #586773; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; }
.adult-link:hover { background: #fff; border-color: #bbc9c9; }
#app { flex: 1; width: min(1220px,100%); margin: 0 auto; padding: 0 clamp(18px,4vw,48px) 40px; }
.site-footer { color: #8d9898; font-size: 12px; display: flex; justify-content: space-between; padding: 16px clamp(18px,4vw,48px) 28px; gap: 12px; }

/* STARTSIDE: én klar beskjed, fire store og tydelige leker. */
.home-intro { display: grid; grid-template-columns: 1fr 310px; align-items: center; min-height: 214px; padding: 17px 6px 14px; position: relative; }
.eyebrow { display: inline-flex; align-items: center; gap: 7px; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #6a9d90; font-weight: 1000; }
h1, h2, h3, p { margin-top: 0; }
.home-title { font-size: clamp(39px,5.6vw,68px); line-height: 1.07; letter-spacing: -2.8px; margin: 12px 0; font-weight: 1000; }
.home-title em { font-style: normal; color: #f0786b; }
.home-subtitle { font-size: clamp(15px,2vw,19px); color: var(--ink-soft); line-height: 1.5; margin-bottom: 0; }
.home-art { position: relative; height: 206px; isolation: isolate; }
.art-orbit { position: absolute; width: 205px; height: 155px; top: 22px; left: 42px; border-radius: 55% 45% 55% 40%; background: #dff2e5; transform: rotate(-11deg); }
.art-orbit:before { content:""; position:absolute; inset:20px; border: 2px dashed #b6dfc7; border-radius:inherit; }
.art-mascot { position:absolute; z-index:2; width: 111px; height: 117px; left: 92px; top: 39px; background: #f4c66e; border-radius: 46% 51% 45% 49%; transform: rotate(-7deg); box-shadow: inset -13px -13px 0 #efb95e, 0 16px 15px rgba(67,93,88,.08); animation: mascotBob 4s ease-in-out infinite; }
.art-mascot .eyes { position: absolute; top: 51px; left: 28px; display: flex; gap: 24px; }
.art-mascot .eyes:before, .art-mascot .eyes:after { content:""; width: 10px; height: 14px; background: #3d565e; border-radius: 50%; }
.art-mascot .smile { width: 17px; height: 10px; position: absolute; top: 76px; left: 48px; border-bottom: 3px solid #3d565e; border-radius: 50%; }
.art-mascot:before, .art-mascot:after { content:""; position:absolute; width: 15px; height: 24px; background:#f4c66e; bottom: -11px; border-radius:50%; }
.art-mascot:before { left: 18px; transform: rotate(20deg); }.art-mascot:after { right: 18px; transform: rotate(-20deg); }
.art-letter { position:absolute; display:grid; place-items:center; width: 53px; height: 53px; border-radius:17px; font-size:26px; font-weight:1000; box-shadow:var(--shadow); }
.art-letter.a { left:30px; top:16px; background: #ffb5aa; transform:rotate(-16deg); }
.art-letter.b { left:218px; top:46px; background: #a2c7fc; transform:rotate(16deg); }
.art-letter.o { left:202px; top:140px; background:#e1c9fd; transform:rotate(-10deg); }
.art-star { position:absolute; color:#eaba55; font-size:29px; left:14px; top:135px; }
.art-spark { position:absolute; color:#79baa8; font-size:25px; left:266px; top:13px; }
@keyframes mascotBob { 0%,100%{translate:0 0} 50%{translate:0 -9px} }

.home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 17px; }
.activity-card { min-height: 204px; border: 0; border-radius: var(--radius); text-align: left; padding: 26px 27px; display: flex; align-items: stretch; justify-content: space-between; position: relative; overflow: hidden; color: var(--ink); transition: transform .18s ease, box-shadow .18s ease; box-shadow: 0 4px 0 rgba(34,58,71,.055); }
.activity-card:hover { transform: translateY(-4px); box-shadow: var(--shadow); }
.activity-card:active { transform: translateY(1px); }
.card-water { background: #deefff; }.card-build { background: #fff0d3; }.card-book { background: #f1e4f9; }.card-hunt { background: #def4e7; }
.card-copy { display:flex; flex-direction:column; justify-content:space-between; min-width:0; position:relative; z-index:1; }
.card-kicker { color: #607381; font-size: 12px; letter-spacing: .4px; font-weight: 850; }
.card-title { display:block; font-size: clamp(26px,3.5vw,37px); font-weight: 1000; line-height:1.1; letter-spacing:-1px; margin: 12px 0 10px; }
.card-short { display:inline-flex; align-items:center; gap:8px; color:#567079; font-weight:750; font-size:14px; }
.card-arrow { font-size: 21px; background:rgba(255,255,255,.75); border-radius:50%; display:grid; place-items:center; width:32px; height:32px; }
.card-visual { width: 36%; flex-shrink:0; position:relative; align-self:center; display:grid; place-items:center; min-width:94px; }
.card-visual:before { content:""; position:absolute; width:135px; height:135px; border-radius:44% 52% 39% 51%; background:rgba(255,255,255,.5); transform:rotate(-12deg); }
.card-icon { position:relative; font-size:clamp(64px,7vw,100px); line-height:1; filter: drop-shadow(0 8px 2px rgba(44,70,60,.07)); transform:rotate(9deg); }
.card-water .card-icon { transform: rotate(-15deg); }
.card-book .card-icon { transform: rotate(6deg); }
.home-bottom { display:flex; justify-content:center; align-items:center; gap:13px; flex-wrap:wrap; margin-top:21px; }
.soft-pill { border:1.5px solid #dfe4dd; background:#fffefa; color:#435b63; padding:13px 19px; min-height:49px; border-radius:99px; font-weight:850; box-shadow:0 3px 0 #e8e8df; }
.soft-pill:hover { background:#fff; border-color:#b9cbc4; }
.soft-pill:active { transform:translateY(2px);box-shadow:none; }
.home-recent { margin: 25px auto 0; text-align:center; color:#6b817c; font-size:13px; }
.home-recent strong { color:#476c67; }

/* Felles toppstripe for aktivitetene. */
.activity-shell { max-width: 1030px; margin: 18px auto 0; }
.activity-topbar { display:flex; justify-content:space-between; align-items:center; gap:14px; margin-bottom:18px; }
.back-btn { min-height:46px; padding: 10px 17px; display:inline-flex; gap:9px; align-items:center; background:#fffdfa; border:1px solid #e3e4e0; border-radius: 99px; color:var(--ink); font-weight:900; }
.back-btn:hover { background:#fff; }
.activity-label { font-size:12px; color:#778986; font-weight:900; letter-spacing:1.5px; text-transform:uppercase; }
.activity-heading { font-size:clamp(30px,4vw,44px); font-weight:1000; letter-spacing:-1.5px; margin:0; }
.activity-heading-row { display:flex; justify-content:space-between; align-items:end; flex-wrap:wrap; gap:12px; margin-bottom:20px; }
.activity-desc { margin:6px 0 0; color:var(--ink-soft); font-size:15px; }
.activity-panel { border:1px solid #f0ece5; background:var(--surface); border-radius:32px; box-shadow:var(--shadow); padding:clamp(18px,3vw,32px); }
.btn { display:inline-flex; align-items:center; justify-content:center; text-align:center; gap:8px; min-height:48px; padding:11px 21px; border:0; border-radius:16px; font-weight:900; color:var(--ink); background:#ecf0ec; transition:transform .14s ease, filter .14s ease; }
.btn:hover { filter:brightness(.98); }.btn:active { transform:scale(.97); }
.btn-primary { background:#315c69; color:white; }.btn-sun { background:#f6cf75; }.btn-mint { background:#ceeedf; }.btn-pink { background:#ffe3e0; }.btn-outline { background:white; border:1.5px solid #e0e5e2; }
.btn-small { min-height:42px; padding:9px 15px; font-size:14px; }
.btn-round { border-radius:99px; }
.btn:disabled { filter:grayscale(.2); }
.button-row { display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
.section-label { font-size:12px; text-transform:uppercase; letter-spacing:1.4px; color:#80908d; font-weight:950; }
.gentle-msg { min-height:34px; color:#55716f; font-weight:800; font-size:15px; }
.icon-button { width:49px; height:49px; border:1px solid #e2e8e3; border-radius:15px; background:#fff; display:inline-grid; place-items:center; font-size:24px; color:var(--ink); }
.icon-button:hover { background:#f2f8f5; }

/* BOKSTAVBLINK: fargekodede blinker, ikke-negative bom og vannpistol. */
.water-layout { display:grid; grid-template-columns:minmax(0,1fr) 285px; gap:20px; align-items:start; }
.water-panel { padding:14px; background:#fff; }
.water-stage { overflow:hidden; min-height:410px; position:relative; border-radius:23px; background:linear-gradient(180deg,#c5e8ff 0%,#e5f6ff 67%,#d2eec4 67%,#a2d3a1 100%); cursor:crosshair; touch-action:manipulation; user-select:none; isolation:isolate; }
.water-stage:before, .water-stage:after { content:""; position:absolute; pointer-events:none; background:rgba(255,255,255,.55); border-radius:50%; }
.water-stage:before { width:170px; height:39px; top:31px; left:11%; box-shadow:16px -14px 0 4px rgba(255,255,255,.55); }
.water-stage:after { width:115px; height:30px; right:5%; top:74px; box-shadow:14px -10px 0 0 rgba(255,255,255,.55); }
.stage-hills { position:absolute; bottom:-18px; left:-15%; width:90%; height:95px; border-radius:50%; background:#8fc99c; box-shadow:240px 35px 0 32px #83c397; }
.stage-sun { position:absolute; width:56px; height:56px; border-radius:50%; background:#ffdc82; right:30px; top:25px; box-shadow:0 0 0 12px rgba(255,223,139,.25); }
.target-wrap { position:absolute; width:88px; height:88px; transform:translate(-50%,-50%); z-index:2; }
.target { position:relative; width:100%; height:100%; border-radius:50%; border:7px solid #fffaf2; box-shadow:0 5px 0 rgba(48,79,91,.13), 0 0 0 2px rgba(48,79,91,.08); display:grid; place-items:center; font-weight:1000; font-size:clamp(29px,4vw,39px); color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.07); }
.target:before, .target:after { content:""; position:absolute; border-radius:50%; pointer-events:none; }
.target:before { inset:5px; border:3px solid rgba(255,255,255,.65); }
.target:after { inset:20px; border:2px solid rgba(255,255,255,.4); }
.target.vowel { background:#ea7378; }.target.consonant { background:#5689dd; }
.target.motion { animation:targetWobble var(--float-duration,3.2s) ease-in-out infinite; animation-delay:var(--float-delay,0s); }
@keyframes targetWobble { 0%,100%{translate:0 0;rotate:-3deg} 50%{translate:var(--float-x,8px) -12px;rotate:4deg} }
.target-pop { animation:targetPop .24s ease-out forwards !important; }
@keyframes targetPop { to{transform:scale(.12);opacity:0} }
.water-gun { position:absolute; width:168px; height:108px; bottom:-4px; left:50%; z-index:5; pointer-events:none; transform-origin:31% 68%; transform:translateX(-31%) rotate(var(--aim,-85deg)); filter:drop-shadow(0 8px 3px rgba(45,80,80,.16)); transition:transform .1s ease-out; }
.water-gun svg { width:100%; height:100%; overflow:visible; }
.water-drop { position:absolute; z-index:6; pointer-events:none; width:16px; height:16px; border-radius:50% 50% 50% 0; background:#56b7f2; box-shadow:0 0 0 3px rgba(255,255,255,.6); transform:translate(-50%,-50%); animation:waterFlight .35s ease-out forwards; }
@keyframes waterFlight { from{ transform:translate(-50%,-50%) scale(.7); opacity:1 } to{ transform:translate(calc(var(--dx) - 50%),calc(var(--dy) - 50%)) scale(.4); opacity:.9 } }
.water-splash { position:absolute; z-index:7; pointer-events:none; font-size:32px; transform:translate(-50%,-50%); animation:splash .5s ease-out forwards; }
@keyframes splash { to{translate:0 -26px;opacity:0;scale:1.5} }
.water-hint { position:absolute; top:12px; left:14px; font-size:12px; color:#416f7e; background:rgba(255,255,255,.78); padding:6px 10px; border-radius:99px; z-index:3; font-weight:850; pointer-events:none; }
.water-side { border-radius:26px; padding:20px; background:#fffefb; border:1px solid #e9e7df; min-height:430px; }
.water-legend { display:flex; gap:13px; margin:8px 0 20px; flex-wrap:wrap; color:#5c7578; font-size:12px; font-weight:850; }
.legend-dot { width:12px; height:12px; border-radius:50%; display:inline-block; margin-right:5px; vertical-align:-1px; }
.legend-dot.red { background:#ea7378; }.legend-dot.blue { background:#5689dd; }
.letter-bag { display:flex; gap:7px; flex-wrap:wrap; align-content:start; min-height:120px; padding-top:12px; }
.letter-chip { width:44px; height:48px; border-radius:13px; background:#fae2ab; color:#405665; display:grid; place-items:center; font-size:23px; font-weight:1000; box-shadow:0 3px 0 #e7be78; border:0; }
.letter-chip:disabled { opacity:.3; box-shadow:none; }
.bag-empty { color:#9a9f9b; font-size:14px; line-height:1.5; margin:0; }
.water-builder { margin-top:15px; padding-top:17px; border-top:1px dashed #d8e1db; }
.built-word { border-radius:16px; background:#e6f5ed; border:2px dashed #91c4ae; min-height:59px; display:flex; align-items:center; justify-content:center; padding:10px; font-size:27px; font-weight:1000; letter-spacing:4px; margin:10px 0 12px; overflow-wrap:anywhere; }
.water-side .btn { width:100%; margin-top:10px; }
.bag-controls { display:flex; gap:8px; }.bag-controls .btn { flex:1; padding:10px 8px; font-size:13px; }

/* ORDBYGGER OG ORDJAKT: én oppgave, tydelige valg. */
.task-card { max-width:730px; margin:0 auto; text-align:center; padding:clamp(18px,4vw,40px); }
.task-sup { color:#8ba29c; letter-spacing:1.2px; text-transform:uppercase; font-size:11px; font-weight:950; }
.task-emoji { display:grid; place-items:center; width:125px; height:125px; margin:9px auto 17px; background:#f2f9ed; border-radius:35px; font-size:70px; box-shadow:inset 0 -7px 0 rgba(87,140,112,.05); }
.task-prompt { font-size:clamp(24px,3.6vw,34px); font-weight:1000; margin:0 0 8px; }
.task-help { color:var(--ink-soft); font-size:14px; margin-bottom:20px; }
.letter-slots { display:flex; justify-content:center; flex-wrap:wrap; gap:8px; min-height:75px; margin:16px 0 22px; }
.word-slot { min-width:53px; width:clamp(49px,8vw,65px); height:65px; border-radius:16px; background:#f1f5f3; border:2px dashed #c5d3ce; display:grid; place-items:center; font-size:32px; font-weight:1000; color:#324c58; }
.word-slot.filled { background:#e7f0ff; border:2px solid #acc4eb; cursor:pointer; }
.tile-tray { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; min-height:65px; margin:0 0 24px; }
.word-tile { width:61px; height:61px; border:0; border-radius:17px; background:#f8d78d; box-shadow:0 4px 0 #ebc270; font-size:30px; font-weight:1000; color:#394e58; }
.word-tile.used { visibility:hidden; }
.word-tile:hover { filter:brightness(1.03); }
.word-tile:active { box-shadow:none; transform:translateY(3px); }
.task-actions { display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; }
.help-inline { min-height:32px; margin:13px auto 5px; text-align:center; font-size:15px; font-weight:850; color:#648d86; }
.success-burst { font-size:55px; animation:popIn .5s ease-out; }
@keyframes popIn { from {transform:scale(.5);opacity:.3} to{transform:scale(1);opacity:1} }
.success-word { font-size:clamp(44px,7vw,65px); font-weight:1000; letter-spacing:2px; margin:10px auto 17px; overflow-wrap:anywhere; }
.word-choices { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:13px; margin:15px auto 24px; }
.word-choice { background:#edf3ff; border:2px solid #dbe6f6; border-radius:20px; padding:26px 6px; font-size:clamp(19px,3.2vw,28px); font-weight:1000; color:var(--ink); min-height:91px; overflow-wrap:anywhere; }
.word-choice:hover { background:#e3edff; }.word-choice.just-tried { background:#fff3dc; border-color:#e9d19f; }
.word-choice.revealed { box-shadow:0 0 0 4px #aed8bf; border-color:#79baa0; }

/* LYDBOKA: bokhylle og skrivebord. Eleven kan skape med bare et bilde. */
.bookshelf { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:16px; padding-top:12px; }
.book-card { display:flex; align-items:center; flex-direction:column; justify-content:center; gap:12px; min-height:225px; text-align:center; border:0; background:#fff2d9; border-radius:24px; color:var(--ink); padding:20px; box-shadow:0 5px 0 rgba(134,104,67,.1); }
.book-card:nth-child(3n) { background:#e8ecff; }.book-card:nth-child(3n+1) { background:#e5f3e9; }
.book-card:hover { transform:translateY(-3px); }
.book-cover { font-size:59px; filter:drop-shadow(0 4px 2px rgba(0,0,0,.08)); }
.book-name { font-size:20px; font-weight:1000; overflow-wrap:anywhere; }
.book-meta { color:#72847e; font-size:12px; font-weight:850; }
.book-new { background:#fafaf8; border:3px dashed #c9d6cf; box-shadow:none; }
.book-new .book-cover { font-size:46px; background:#daefdf; width:85px; height:85px; display:grid; place-items:center; border-radius:50%; }
.writer-layout { display:grid; grid-template-columns:minmax(0,1fr) 248px; gap:20px; align-items:start; }
.writer-main { background:#fff; border:1px solid #ecebe4; border-radius:28px; padding:clamp(17px,3vw,29px); box-shadow:var(--shadow); }
.writer-title-row { display:flex; gap:12px; align-items:center; justify-content:space-between; margin-bottom:13px; }
.book-title-field { min-width:0; flex:1; padding:12px 14px; border:1.5px solid #e4e7e3; border-radius:14px; font-size:clamp(17px,3vw,23px); font-weight:1000; color:var(--ink); background:#fffefb; }
.autosave-note { font-size:12px; color:#648f82; white-space:nowrap; font-weight:850; }
.page-paper { background:#fffcf3; border:1px solid #f0e8d9; box-shadow:inset 0 0 0 9px rgba(255,255,255,.45); border-radius:20px; padding:clamp(14px,2.4vw,25px); min-height:435px; }
.page-sticker { display:block; border:0; background:transparent; margin:0 auto 7px; text-align:center; font-size:67px; min-height:85px; }
.page-photo { display:block; width:min(100%,460px); max-height:230px; object-fit:contain; margin:7px auto 18px; border-radius:13px; }
.page-text { display:block; width:100%; min-height:170px; resize:vertical; border:1px solid #f2e5d1; background:rgba(255,255,255,.85); border-radius:13px; outline-color:#93bca4; padding:17px; font-size:clamp(19px,2.5vw,24px); line-height:1.7; color:#314551; }
.page-text::placeholder { color:#9ba79f; }
.page-turner { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:17px; }
.page-counter { font-weight:900; color:#789088; font-size:14px; }
.writer-tools { background:#fffefa; border:1px solid #e8e6dc; border-radius:25px; padding:19px; }
.writer-tools h3 { font-size:16px; margin:0 0 13px; }
.writer-tools .btn { width:100%; margin-bottom:9px; }
.sticker-picker { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin:10px 0 18px; }
.sticker-option { min-height:49px; background:#f4f6f1; border:2px solid transparent; border-radius:13px; font-size:25px; }
.sticker-option.active { border-color:#84b6a0; background:#e6f5e9; }
.tool-divider { border:0; height:1px; background:#e6e8e1; margin:16px 0; }
.writer-tools details { color:#566e70; font-size:13px; }.writer-tools details summary { cursor:pointer; padding:8px 0; font-weight:900; }
.writer-tools details .btn { margin-top:8px; }

/* ROLIG LEK */
.garden-panel { max-width:730px; margin:auto; text-align:center; background:linear-gradient(#fffdf6,#edfaef); }
.garden-plot { min-height:215px; display:flex; justify-content:center; align-items:center; gap:13px; border-radius:26px; margin-bottom:24px; background:radial-gradient(ellipse at bottom, #c3ebbc 0 35%,transparent 36%),#eff9ef; }
.garden-flower { display:grid; place-items:center; width:125px; height:125px; border-radius:50%; font-size:73px; background:#ffeab4; box-shadow:0 0 0 12px #f5d6a5, 0 7px 0 #deba7a; }
.garden-options { display:flex; flex-wrap:wrap; gap:15px; justify-content:center; margin:12px 0 19px; }
.garden-option { width:95px; height:95px; border:2px solid #c6dacf; border-radius:24px; background:white; font-size:48px; font-weight:1000; color:#3e6056; }
.garden-option:hover { background:#e7f9ed; }.garden-option.revealed { box-shadow:0 0 0 4px #a7d5b8; }
.garden-grown { min-height:45px; display:flex; justify-content:center; flex-wrap:wrap; gap:8px; font-size:27px; }

/* LÆRERHJØRNET: mer informasjon er samlet her, ikke foran eleven. */
.teacher-layout { max-width:870px; margin:auto; }
.teacher-intro { color:var(--ink-soft); font-size:15px; line-height:1.6; max-width:700px; }
.teacher-grid { display:grid; grid-template-columns:1fr 1fr; gap:17px; }
.teacher-card { border:1px solid #e8e8df; border-radius:25px; background:white; padding:22px; }
.teacher-card.full { grid-column:1/-1; }
.teacher-card h3 { font-size:20px; margin:0 0 9px; }
.teacher-card p { color:#6d7b7c; font-size:13px; line-height:1.6; }
.control-label { display:block; font-size:13px; color:#405766; font-weight:900; margin:16px 0 7px; }
.control-input { width:100%; min-height:47px; border:1.5px solid #dbe3df; background:#fffefa; border-radius:12px; padding:9px 11px; color:var(--ink); }
.control-check { display:flex; gap:10px; align-items:center; font-size:14px; font-weight:800; margin:14px 0; }
.control-check input { width:22px; height:22px; accent-color:#478778; }
.teacher-note { border-radius:17px; background:#edf6f1; padding:13px; color:#4d6e62; font-size:13px; line-height:1.6; margin-top:12px; }
.teacher-buttons { display:flex; gap:9px; flex-wrap:wrap; margin-top:12px; }
.record-list { display:flex; flex-direction:column; gap:7px; margin-top:14px; }
.record-item { background:#f6f8f4; border-radius:12px; display:flex; align-items:center; gap:8px; padding:9px; }
.record-item strong { flex:1; font-size:14px; overflow-wrap:anywhere; }
.record-item .btn { padding:8px 12px; min-height:39px; }
.teacher-card details summary { font-weight:900; padding:12px 0; cursor:pointer; }
.teacher-card details p { margin-bottom:9px; }
.helper-line { color:#69847b; font-size:13px; min-height:21px; }
.record-status { font-weight:850; color:#6c817a; font-size:13px; margin-top:10px; }

/* Meldinger forsvinner av seg selv, uten å avbryte leken. */
.toast { position:fixed; bottom:28px; left:50%; z-index:100; min-width:230px; max-width:min(440px,90vw); transform:translate(-50%,20px); background:#274e5b; color:white; padding:14px 21px; text-align:center; border-radius:17px; font-size:15px; font-weight:900; box-shadow:0 12px 28px rgba(27,53,65,.2); opacity:0; pointer-events:none; transition:opacity .2s ease,transform .2s ease; }
.toast.visible { opacity:1; transform:translate(-50%,0); }

@media (max-width: 980px) {
  .water-layout { grid-template-columns:1fr; }
  .water-side { min-height:0; }
  .letter-bag { min-height:64px; }
  .writer-layout { grid-template-columns:1fr; }
  .writer-tools { display:flex; flex-wrap:wrap; gap:10px; align-items:start; }
  .writer-tools h3 { width:100%; margin-bottom:0; }
  .writer-tools > .btn { width:auto; margin-bottom:0; flex:1; }
  .writer-tools .sticker-picker { width:100%; display:flex; gap:6px; overflow-x:auto; margin:0; }
  .sticker-option { width:54px; min-width:54px; }
  .writer-tools .tool-divider { width:100%; margin:4px 0; }
  .writer-tools details { width:100%; }
}
@media (max-width: 690px) {
  .site-header { padding:17px 18px 7px; }
  .header-note { display:none; }
  .brand-text { font-size:25px; }
  .brand-mark { width:41px; height:41px; }
  .adult-link span:last-child { display:none; }
  .adult-link { width:45px; height:45px; justify-content:center; font-size:20px; }
  #app { padding:0 14px 34px; }
  .home-intro { grid-template-columns:1fr; min-height:0; padding:30px 9px 25px; }
  .home-title { font-size:clamp(38px,10.4vw,56px); }
  .home-art { display:none; }
  .home-grid { gap:12px; }
  .activity-card { padding:19px 15px; min-height:168px; flex-direction:column-reverse; gap:12px; }
  .card-visual { width:100%; height:52px; min-width:0; justify-content:flex-start; }
  .card-visual:before { width:74px; height:74px; left:0; }
  .card-icon { font-size:55px; }
  .card-kicker { display:none; }
  .card-title { font-size:clamp(21px,5.8vw,29px); margin:0 0 6px; }
  .card-short { font-size:12px; }
  .card-arrow { display:none; }
  .activity-shell { margin-top:12px; }
  .activity-topbar { margin-bottom:18px; }
  .activity-label { font-size:10px; }
  .activity-heading { font-size:31px; }
  .activity-panel { padding:14px; border-radius:25px; }
  .water-stage { min-height:365px; }
  .target-wrap { width:72px; height:72px; }
  .target { border-width:5px; font-size:29px; }
  .water-gun { width:140px; bottom:-13px; }
  .water-side { padding:16px; }
  .word-choices { grid-template-columns:1fr; gap:9px; }
  .word-choice { min-height:63px; padding:10px 6px; }
  .task-emoji { width:102px; height:102px; font-size:57px; }
  .word-slot { width:clamp(42px,11vw,56px); min-width:42px; height:58px; font-size:27px; }
  .word-tile { width:clamp(47px,12vw,60px); height:57px; font-size:25px; }
  .page-paper { min-height:340px; }
  .page-text { min-height:135px; }
  .teacher-grid { grid-template-columns:1fr; }
  .teacher-card.full { grid-column:auto; }
  .teacher-card { padding:18px; }
  .site-footer .footer-privacy { display:none; }
  .page-turner .btn { padding:9px 11px; font-size:13px; }

}
@media (max-width: 365px) {
  .activity-card { min-height:147px; }
  .card-title { font-size:20px; }
  .water-stage { min-height:340px; }
  .target-wrap { width:65px; height:65px; }
  .word-slot { min-width:36px; width:40px; height:50px; }
}
@media (prefers-reduced-motion:reduce) {
  *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; scroll-behavior:auto !important; }
}
body.calm-motion .target.motion, body.calm-motion .art-mascot { animation:none; }
/*
  Ekstra mobilrettelse: Når mange emojier står ved siden av hverandre,
  skal kun figur-raden kunne rulles sidelengs, ikke hele LydBoka.
*/
.writer-main,.writer-tools { min-width:0; }
.writer-layout { grid-template-columns:minmax(0,1fr) 248px; }
@media (max-width:980px) {
  .writer-layout { grid-template-columns:minmax(0,1fr); }
  .writer-tools { overflow:hidden; }
  .writer-tools .sticker-picker { flex:0 1 100%; width:100%; min-width:0; max-width:100%; }
  .writer-tools > .btn { min-width:130px; }
}
@media (max-width:690px) {
  .writer-tools > .btn { flex:1 1 43%; }
  .writer-tools .sticker-picker { overflow-x:auto; overscroll-behavior-x:contain; }
}
/* Én diskret lytt-knapp på startsiden – også elever som ikke leser ennå
   kan høre valgene uten at vi fyller skjermen med instruksjoner. */
.hear-inline { vertical-align:middle; margin-left:9px; width:40px; height:40px; border:1px solid #d7e3dd; border-radius:50%; background:white; font-size:19px; }
.hear-inline:hover { background:#edf8f2; }
/* Vannpistolen beveger seg litt bakover når den skyter. */
.water-gun.kick svg { animation:gunKick .2s ease-out; }
@keyframes gunKick { 0%,100% {transform:translateX(0)} 40% {transform:translateX(-8px)} }

/* ============================================================================
   ORDØYA 1.2 – ORD-SAMLEHYLLE, SETNINGER OG FANTASIDINOSAURER
   ============================================================================
   Hvorfor? Elever skal kunne ta vare på det de lager. Dinosaurene markerer
   oppdagelser etter ti fullførte runder – helt uavhengig av antall feil.
   Selv om det nå finnes mer innhold, er det gjemt bak enkle, tydelige knapper.
*/

/* En rolig, klikkbar forhåndsvisning av dinosaurrommet på startsiden. */
.dino-home-banner { display:flex; align-items:center; gap:16px; width:100%; margin:20px 0 0;
  padding:13px 19px; min-height:104px; text-align:left; border:2px solid #dcd8f0;
  border-radius:24px; background:linear-gradient(105deg,#f8f1ff,#e7f7ef); color:#344b62;
  box-shadow:0 3px 0 #e1e5e5; transition:transform .15s; }
.dino-home-banner:hover { transform:translateY(-2px); }
.dino-banner-art { display:grid; place-items:center; width:80px; height:72px; flex-shrink:0;
  border-radius:20px; background:rgba(255,255,255,.75); font-size:41px; overflow:hidden; }
.dino-banner-art svg { width:100px; max-width:110%; }
.dino-banner-words { display:flex; flex-direction:column; gap:4px; min-width:125px; }
.dino-banner-words strong { font-size:clamp(18px,2.2vw,25px); font-weight:1000; }
.dino-banner-words small { font-size:13px; color:#667e83; font-weight:800; }
.dino-meter { display:block; flex:1; height:13px; background:rgba(255,255,255,.9);
  border:1px solid #d1d4e2; border-radius:30px; overflow:hidden; }
.dino-meter i, .progress-track i { display:block; height:100%; border-radius:inherit;
  background:linear-gradient(90deg,#a98ae1,#6dc5a1); transition:width .25s ease; }
.dino-banner-arrow { font-size:25px; font-weight:900; color:#7285ad; }
.task-progress { font-weight:1000; min-height:40px; border:1px solid #dbdfde;
  background:#fff; border-radius:40px; padding:7px 12px; color:#526d77; white-space:nowrap; }
.activity-topbar .activity-label { margin-left:auto; }

/* BOKSTAVBLINK – den korte ordhylla er alltid synlig i sidepanelet. */
.water-words-mini { margin-top:18px; padding-top:16px; border-top:2px dashed #e0e5dc; }
.water-words-mini-heading { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:16px; }
.shelf-mini-link { color:#376775; background:#e5f7f1; border:none; border-radius:99px;
  padding:8px 12px; font-size:12px; font-weight:950; white-space:nowrap; }
.mini-word-list { display:flex; flex-wrap:wrap; gap:7px; margin-top:12px; }
.mini-saved-word { min-height:40px; font-weight:850; border:1px solid #ddd4bb; background:#fff8e8;
  border-radius:11px; padding:7px 11px; font-size:16px; color:#405463; }
.empty-shelf-hint { display:block; padding:12px 4px; font-size:13px; color:#718a83; }
.new-dino-prompt { display:block; width:100%; margin:15px 0 10px; padding:14px 17px;
  border:2px solid #c4a8e9; border-radius:16px; background:#f3e8ff; font-size:16px;
  font-weight:1000; color:#4a3e77; text-align:center; animation:eggGlow 2s ease-in-out infinite; }
@keyframes eggGlow { 0%,100% {box-shadow:0 0 0 0 #dfc9ff} 50% {box-shadow:0 0 0 6px #f2e8ff} }

/* ORD-SAMLEHYLLA – store ordkort slik at eleven kjenner igjen sine egne ord. */
.shelf-shell,.sentence-shell {max-width:880px;}
.shelf-heading { display:flex; align-items:center; gap:14px; }
.shelf-heading h2 { margin-bottom:4px; font-size:clamp(19px,3vw,26px); }
.shelf-heading p { color:#788681; font-size:14px; margin:0; }
.shelf-emoji { font-size:45px; }
.word-shelf-grid { display:flex; flex-wrap:wrap; align-items:flex-start; gap:12px; margin:25px 0; }
.word-shelf-card { display:flex; align-items:center; gap:10px; min-height:64px; padding:13px 20px;
  background:#fff5da; color:#2c4c55; border:2px solid #e7c980; border-radius:16px;
  font-size:clamp(21px,3vw,26px); font-weight:1000; box-shadow:0 4px 0 #eddfc1; }
.word-shelf-card span { font-size:18px; opacity:.75; }
.word-shelf-card:hover { transform:translateY(-2px); }
.empty-word-shelf { display:flex; flex-direction:column; align-items:center; padding:30px 8px;
  text-align:center; color:#78908b; }
.empty-word-shelf span { font-size:70px; }.empty-word-shelf p {font-size:18px;}
.word-shelf-actions { display:flex; flex-wrap:wrap; gap:11px; margin-top:20px; }
.word-shelf-actions .btn {flex:0 1 auto;}

/* Setningsverkstedet er et eget rom. Ingen rettskrivingskontroll eller vurdering. */
.sentence-canvas { padding:24px; min-height:188px; border:2px dashed #bcd9c8; background:#f1fbf3;
  border-radius:24px; margin-bottom:25px; }
.sentence-tiles {display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin-top:15px;min-height:60px;}
.sentence-tile { display:inline-flex; gap:9px; align-items:center; background:white; color:#354f66;
  border:2px solid #9fccc0; border-radius:13px; padding:9px 14px; min-height:51px;
  font-size:clamp(18px,3vw,25px); font-weight:950; }
.sentence-tile small {display:grid;place-items:center;width:18px;height:18px;background:#e6f0eb;
  border-radius:50%;font-size:15px;color:#6a797d;}
.sentence-period { font-size:27px; font-weight:900; }
.sentence-placeholder { margin:15px 0; font-size:20px; font-weight:800; color:#8ca99a; }
.sentence-controls { display:flex; flex-wrap:wrap; gap:9px; margin-top:15px; }
.sentence-word-bank {display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;}
.sentence-bank-word {min-height:55px;padding:10px 17px;background:#fff2d9;
  border:2px solid #eacb87;border-radius:16px;font-weight:950;font-size:20px;color:#384f5c;}
.sentence-bank-word:hover {background:#ffe8b4;}
.saved-sentences { border-top:1px solid #e3eae5; margin-top:28px; padding-top:22px; }
.saved-sentences h2 {font-size:21px;}
.saved-sentence {display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:#fffaf0;border:1px solid #eee0c0;border-radius:14px;padding:15px;
  min-height:55px;margin-bottom:9px;font-size:17px;text-align:left;color:#354b62;width:100%;font-weight:800;}

/* DINO-ROMMET: unike SVG-dyr, korte trykk-animasjoner og ett egg for neste. */
.dino-shell {max-width:1040px;}
.dino-room-banner {display:flex;align-items:center;gap:17px;background:linear-gradient(115deg,#eee5ff,#dbf4ef);
  border:1px solid #d6d7ee;border-radius:26px;padding:18px 22px;margin-bottom:17px;min-height:122px;}
.dino-room-icon {font-size:55px;filter:drop-shadow(0 5px 1px rgba(59,70,81,.08));}
.dino-room-summary {flex:1;display:flex;flex-direction:column;gap:7px;min-width:0;}
.dino-room-summary strong {font-size:clamp(19px,3vw,26px);}
.dino-room-summary span, .dino-room-summary small {font-size:13px;color:#637b81;font-weight:750;}
.progress-track {width:100%;max-width:480px;height:13px;background:white;border:1px solid #d3dadb;border-radius:50px;overflow:hidden;}
.dino-room-banner .new-dino-prompt {width:auto;margin:0;flex-shrink:0;}
.dino-tap-hint {font-size:17px;color:#738580;font-weight:850;margin:20px 0 14px;text-align:center;}
.dino-gallery {display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px;}
.dino-card {position:relative;display:flex;flex-direction:column;align-items:center;
  justify-content:end;min-width:0;min-height:248px;padding:16px 12px 17px;
  border:2px solid #e0e5dd;border-bottom:6px solid #c6ded3;border-radius:25px;
  background:radial-gradient(ellipse at 50% 84%,#d6eed9 0 23%,transparent 24%),linear-gradient(#f2f9ff,#eef8eb);
  color:var(--ink);overflow:hidden;box-shadow:0 6px 15px rgba(36,74,66,.06);}
.dino-card:hover {border-color:#a6d3bf;transform:translateY(-2px);}
.dino-figure {width:min(100%,210px);height:181px;display:flex;align-items:center;justify-content:center;
  transform-origin:50% 90%;position:relative;z-index:1;}
.dino-figure svg {width:100%;height:auto;overflow:visible;filter:drop-shadow(0 6px 2px rgba(54,85,87,.09));}
.dino-name {position:relative;z-index:1;font-size:clamp(19px,2.1vw,25px);font-weight:1000;line-height:1.2;}
.dino-speech {position:absolute;top:12px;right:11px;background:white;padding:5px 9px;border-radius:50% 50% 50% 8%;
  border:2px solid #c0d5cf;color:#43536c;font-size:14px;font-weight:1000;
  opacity:0;transform:translateY(7px) scale(.7);pointer-events:none;}
.dino-card.is-playing .dino-figure {animation:dinoJump .9s cubic-bezier(.2,.6,.2,1);}
.dino-card.is-playing .dino-speech {animation:dinoSpeech .93s ease-out forwards;}
@keyframes dinoJump {0%,100%{transform:translateY(0) rotate(0)}24%{transform:translateY(-19px) rotate(-7deg)}52%{transform:translateY(2px) rotate(6deg)}78%{transform:translateY(-8px) rotate(-2deg)}}
@keyframes dinoSpeech {0%{opacity:0;transform:translateY(9px) scale(.7)}20%,75%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-9px) scale(1.04)}}
.dino-locked {display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
  border-radius:25px;border:2px dashed #d7d3cb;min-height:245px;background:#f4f3ec;color:#8b8e83;text-align:center;padding:20px;}
.locked-egg {font-size:79px;filter:grayscale(.2);}
.dino-locked strong {font-size:18px;}.dino-locked small {font-size:13px;}
.dino-reveal-shell {min-height:65vh;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.dino-reveal-shell h1 {font-size:clamp(32px,5vw,53px);margin:6px 0 11px;letter-spacing:-1.4px;}
.dino-reveal-shell p {color:#677f83;font-weight:850;}
.dino-reveal-shell .dino-card {width:min(100%,370px);min-height:350px;border-width:3px;border-bottom-width:7px;}
.dino-reveal-shell .dino-figure {width:min(100%,310px);height:260px;}
.dino-reveal-shell .dino-name {font-size:31px;}
.reveal-confetti {color:#d494df;font-size:27px;letter-spacing:16px;animation:confettiSway 2.4s ease-in-out infinite;}
@keyframes confettiSway {50%{transform:translateY(-10px)}}
.dino-reveal-shell .task-actions {justify-content:center;}

@media(max-width:690px){
  .dino-home-banner {gap:12px;padding:10px 12px;min-height:85px;border-radius:19px;}
  .dino-banner-art {width:56px;height:59px;font-size:35px;flex-shrink:0;}
  .dino-banner-words {min-width:0;flex:1;}.dino-banner-words strong {font-size:17px;}
  .dino-banner-words small {font-size:11px;}
  .dino-meter {display:none;}.dino-banner-arrow {font-size:22px;}
  .activity-label {display:none;}
  .task-progress {margin-left:auto;}
  .word-shelf-card {min-height:55px;padding:9px 13px;font-size:21px;}
  .sentence-canvas {padding:16px;min-height:168px;}
  .sentence-controls .btn {padding:9px 12px;}
  .dino-room-banner {padding:14px;flex-wrap:wrap;gap:11px;}
  .dino-room-icon {font-size:43px;}.dino-room-summary {flex-basis:70%;}
  .dino-room-banner .new-dino-prompt {width:100%;}
  .dino-gallery {grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
  .dino-card {min-height:180px;padding:9px 7px;border-radius:20px;}

// Ved delt nettbrett må den voksne ta hensyn til personvern.
// ────────────────────────────────────────────────────────────────────────────
function loadState() {
  const fresh = newState();
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if (!saved || typeof saved !== 'object') return fresh;
    const settings = {...fresh.settings,...(saved.settings || {})};
    settings.level = [1,2,3,4,5].includes(Number(settings.level)) ? Number(settings.level) : 1;
    // Migrering: Kontekstsetningen løste ikke opplesning av SAL. Bruk selve ordet.
    settings.wordSpeech='single';
    settings.speechRate = Math.max(.6,Math.min(1.15,Number(settings.speechRate) || .87));
    return {
      settings,
      books:Array.isArray(saved.books) ? saved.books : [],
      recordings:saved.recordings && typeof saved.recordings==='object' ? saved.recordings : {},
      pronunciationHints: saved.pronunciationHints && typeof saved.pronunciationHints==='object' && !Array.isArray(saved.pronunciationHints) ? saved.pronunciationHints : {},
      waterBag:Array.isArray(saved.waterBag) ? saved.waterBag : [],
      waterWords:Array.isArray(saved.waterWords) ? saved.waterWords.filter(w=>typeof w==='string').slice(0,250) : [],
      waterSentences:Array.isArray(saved.waterSentences) ? saved.waterSentences.filter(w=>typeof w==='string').slice(0,120) : [],
      // Nye felt får standardverdier. Dermed virker også lagringer fra versjon 1.1.
      creatures:normalizeCreatures(saved.creatures),
      discovered:Array.isArray(saved.discovered) ? saved.discovered : [],
      garden:Array.isArray(saved.garden) ? saved.garden : [],
      sessions:{...fresh.sessions,...(saved.sessions || {})},
      mastery:{streak:Math.max(0,Math.min(6,Number(saved.mastery?.streak)||0))}
    };
  } catch(err) {
    console.warn('Ordøya: Klarte ikke hente lagret innhold.',err);
    return fresh;
  }
}
let state = loadState();

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
    return true;
  } catch(err) {
    console.warn('Ordøya: Lagringen ble stoppet av nettleseren.',err);

  return String(value).replace(/[&<>"']/g,c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showLetter(letter) { return state.settings.uppercase ? letter.toUpperCase() : letter.toLowerCase(); }
function textWord(word) { return state.settings.uppercase ? word.toUpperCase() : word.toLowerCase(); }
function isVowel(letter) { return VOWELS.includes(String(letter).toUpperCase()); }
function shuffle(array) {
  const result=[...array];
  for(let i=result.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [result[i],result[j]]=[result[j],result[i]]; }
  return result;
}
function pick(array) { return array[Math.floor(Math.random()*array.length)]; }
function id() { return 'o'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function getBook() { return state.books.find(book=>book.id===ui.bookId); }
// Selv om noen importerer en ødelagt sikkerhetskopi, skal et bildefelt
// aldri kunne legge HTML-kode inn i siden.
function safeImageData(url) {
  if(typeof url!=='string' || url.length>4000000)return '';
  return /^data:image\/(jpeg|png|webp);base64,[a-zA-Z0-9+/=]+$/.test(url)?url:'';
}
function taskList() { return WORDS[state.settings.level] || WORDS[1]; }
function normalizeCreatures(value) {
  const valid=new Set(DINOS.map(d=>d.id));
  const obj=value && typeof value==='object'?value:{};
  const owned=Array.isArray(obj.owned)?[...new Set(obj.owned.filter(id=>valid.has(id)))]:[];
  const unseen=Array.isArray(obj.unseen)?[...new Set(obj.unseen.filter(id=>owned.includes(id)))]:[];
  return {completed:Math.max(0,Math.min(100000,Number(obj.completed)||0)),owned,unseen};
}
function nextDino() { return DINOS.find(d=>!state.creatures.owned.includes(d.id)); }
function currentDino() { return DINOS.find(d=>d.id===state.creatures.owned.at(-1)) || DINOS[0]; }
function progressInTen() { return state.creatures.completed % 10; }
// Å få hjelp eller gjøre flere forsøk hindrer aldri at runden teller.
// Vi teller runden når eleven har jobbet med den og går videre, eller løser den.
// En oppgave som hoppes over før eleven gjør noe, teller ikke.
function completedRound() {
  const info=state.creatures;
  info.completed++;
  if(info.completed%10===0) {
    const found=nextDino();
    if(found){info.owned.push(found.id);info.unseen.push(found.id);}
  }
  saveState();
  if(info.unseen.length){playSound('dino');toast('🥚 Et dinosaur-egg har klekket!');}
}

function recordIndependentSolve(independent) {

// Korte, lavmælte lyder skapes lokalt med Web Audio. Ingen lydfiler,
// nedlastinger eller automatisk avspilling: lyd starter først når noen trykker.
let soundContext=null;
function playSound(kind='tap') {
  if(!state.settings.sound)return;
  try {
    const AudioEngine=window.AudioContext||window.webkitAudioContext;
    if(!AudioEngine)return;
    if(!soundContext)soundContext=new AudioEngine();
    if(soundContext.state==='suspended')soundContext.resume().catch(()=>{});
    const notes={
      tap:[[530,.045,0]], splash:[[270,.06,0],[220,.06,.055]],
      collect:[[620,.07,0],[820,.09,.075]],
      good:[[520,.08,0],[660,.1,.08],[780,.13,.17]],
      dino:[[390,.12,0],[520,.12,.13],[660,.15,.26],[900,.22,.42]],
      magic:[[660,.14,0],[890,.13,.16],[1050,.2,.32]],
      gentle:[[460,.08,0]]
    };
    const now=soundContext.currentTime;
    (notes[kind]||notes.tap).forEach(([freq,duration,delay])=>{
      const osc=soundContext.createOscillator(),gain=soundContext.createGain();
      osc.type=kind==='splash'?'triangle':'sine';
      osc.frequency.setValueAtTime(freq,now+delay);
      gain.gain.setValueAtTime(.0001,now+delay);
      gain.gain.exponentialRampToValueAtTime(kind==='dino'?.032:.018,now+delay+.012);
      gain.gain.exponentialRampToValueAtTime(.0001,now+delay+duration);
      osc.connect(gain);gain.connect(soundContext.destination);
      osc.start(now+delay);osc.stop(now+delay+duration+.025);
    });
  }catch(err){console.warn('Lydeffekt utilgjengelig',err);}
}

function aimWaterGun(evt) {
  const stage=document.querySelector('#water-stage');
  if(!stage) return;
  const r=stage.getBoundingClientRect();
  const dx=evt.clientX-(r.left+r.width*.5), dy=evt.clientY-(r.bottom-42);
  const angle=Math.atan2(dy,dx)*180/Math.PI;
  stage.style.setProperty('--aim',Math.max(-160,Math.min(-20,angle))+'deg');
}
function waterFire(evt) {
  const stage=evt.target.closest('#water-stage'); if(!stage) return;
  const r=stage.getBoundingClientRect();
  const x=evt.clientX-r.left,y=evt.clientY-r.top;
  aimWaterGun(evt);
  const drop=document.createElement('span');
  drop.className='water-drop';
  drop.style.left=(r.width*.5)+'px';drop.style.top=(r.height-42)+'px';
  drop.style.setProperty('--dx',(x-r.width*.5)+'px');
  drop.style.setProperty('--dy',(y-(r.height-42))+'px');
  stage.appendChild(drop);
  // En liten rekyl gjør vannpistolen levende uten å være stressende.
  const gun=document.querySelector('#water-gun');
  if(gun){gun.classList.remove('kick');void gun.offsetWidth;gun.classList.add('kick');}
  setTimeout(()=>{drop.remove();gun?.classList.remove('kick');},390);
  const splash=document.createElement('span');
  splash.className='water-splash';splash.textContent='💦';
  splash.style.left=x+'px'; splash.style.top=y+'px';
  stage.appendChild(splash);setTimeout(()=>splash.remove(),550);
  const target=evt.target.closest('.target');
  if(target) hitWaterTarget(target.dataset.id);
  else{playSound('splash');setFeedback('#water-feedback','Plask! 💦');}
}
const pendingWater=new Set();
function hitWaterTarget(targetId) {
  const t=ui.waterTargets.find(item=>item.id===targetId);
  if(!t || pendingWater.has(targetId)) return;
  pendingWater.add(targetId);
  playSound('collect');
  const letter=t.letter;
  state.waterBag.push(letter);
  if(state.waterBag.length>80) {
    state.waterBag.shift(); // Holder lagringen liten.
    ui.waterBuild=ui.waterBuild.map(i=>i-1).filter(i=>i>=0);
  }
  // Et nytt treff skal ikke viske ut et ord eleven er i ferd med å lage.
  saveState();
  updateWaterSidebar();
  setFeedback('#water-feedback',`Du fant ${letter}! ✨`);
  const btn=document.querySelector(`.target-wrap[data-id="${targetId}"] .target`);
  if(btn) btn.classList.add('target-pop');
  setTimeout(()=>{
    t.letter=randomWaterLetter();
    pendingWater.delete(targetId);
    const wrap=document.querySelector(`.target-wrap[data-id="${targetId}"]`);
    if(wrap && ui.screen==='water') wrap.outerHTML=waterTargetHTML(t,WATER_POSITIONS.findIndex((p,i)=>'t'+i===targetId));
  },270);
}

function waterSaveWord() {
  const word=ui.waterBuild.map(i=>state.waterBag[i]).join('').trim().toLowerCase();
  if(!word) return;
  const exists=state.waterWords.some(w=>w.toLowerCase()===word);
  // Ordhylla er varig: vi beholder ett eksemplar av hvert ord og sletter
  // aldri det eldste ordet i skjul. Eleven kan fortsatt lage samme ord flere ganger.
  if(!exists && state.waterWords.length>=250){
    toast('Ordhylla er full. Be en voksen ta en sikkerhetskopi.');return;
  }
  if(!exists)state.waterWords.push(word);
  // Si ordet som ETT ord (små bokstaver), ikke som bokstavnavn i Edge.
  speakWord(word);
  // NY RUNDE: Bokstavene tømmes først etter at hele ordet er lagret.
  // Da slipper eleven å tømme bokstavene selv og kan sprute videre.
  state.waterBag=[];
  ui.waterBuild=[];

  completedRound();
  updateWaterSidebar();
  toast(`«${textWord(word)}» bor nå på ordhylla! 📚`);
}

// ────────────────────────────────────────────────────────────────────────────
// 4B. ORD-HYLLE OG SETNINGSVERKSTED
// Ordene er elevens egne oppdagelser: de skal ikke forsvinne etter «Ferdig».

// ────────────────────────────────────────────────────────────────────────────

// ────────────────────────────────────────────────────────────────────────────
// 5. ORDBYGGER – BYGG ORDET SOM PASSER TIL BILDET
// Eleven kan prøve seg frem, flytte bokstaver, få hint og hoppe til neste ord.
// Et feil forsøk fjerner aldri et svar eller tidligere fremgang.
// ────────────────────────────────────────────────────────────────────────────
function startBuildTask(advance=true) {
  if(advance) state.sessions.build++;
  const list=taskList();
  const data=list[state.sessions.build % list.length];
  const correct=data.word.toUpperCase().split('');
  const distractions=shuffle(LETTERS.filter(l=>!correct.includes(l))).slice(0,2);
  ui.buildTask={data,tiles:shuffle([...correct,...distractions]),chosen:[],errors:0,hints:0,solved:false,assisted:false,participated:false,counted:false};
  saveState();
}
function buildHTML() {
  const task=ui.buildTask;
  return `<section class="activity-shell">
    ${activityHeader('ORDBYGGER','Bygg ord','Bruk bokstavene. Du kan prøve så mange ganger du vil.')}
    <div class="activity-panel task-card">
      ${task.solved ? successHTML(task.data.word,task.assisted,'build-next') : `
      <div class="task-sup">SE PÅ BILDET</div>
      <div class="task-emoji" aria-label="${escapeHTML(task.data.word)}">${task.data.emoji}</div>
      <h2 class="task-prompt">Hvilket ord passer?</h2>
      <p class="task-help">Trykk på bokstavene.</p>
      <div class="letter-slots" aria-label="Bokstavene du har valgt">
        ${task.data.word.split('').map((_,i)=>{
          const tileIndex=task.chosen[i];
          return tileIndex===undefined?
            `<span class="word-slot" aria-label="Tom plass">·</span>`:
            `<button class="word-slot filled" data-action="build-remove" data-index="${i}" aria-label="Fjern ${escapeHTML(task.tiles[tileIndex])}">${showLetter(task.tiles[tileIndex])}</button>`;
        }).join('')}
      </div>
      <div class="tile-tray" aria-label="Velg bokstaver">
        ${task.tiles.map((letter,i)=>`<button class="word-tile ${task.chosen.includes(i)?'used':''}"
          data-action="build-add" data-index="${i}" ${task.chosen.includes(i)?'disabled':''} aria-label="Bokstaven ${letter}">${showLetter(letter)}</button>`).join('')}
      </div>
      <div class="task-actions">
        <button class="btn btn-outline" data-action="build-hear" aria-label="Hør ordet">🔊 Hør</button>
        <button class="btn btn-sun" data-action="build-hint">💡 Hint</button>
        <button class="btn btn-primary" data-action="build-check" ${task.chosen.length!==task.data.word.length?'disabled':''}>Prøv ✓</button>
      </div>
      <div id="build-feedback" class="help-inline" aria-live="polite">${task.hints?buildHintText(task):' '}</div>
      <button class="btn btn-outline btn-small btn-round" style="margin-top:8px" data-action="build-next">Et annet ord →</button>
      `}
    </div>
  </section>`;
}
function buildHintText(task) {
  if(task.hints>=3) return `Ordet er ${textWord(task.data.word)}. Du kan legge det, eller prøve et nytt!`;
  if(task.hints>=2) return `Se etter ${showLetter(task.data.word[0])} og ${showLetter(task.data.word[1]||'')}.`;
  return `Ordet begynner med ${showLetter(task.data.word[0])}.`;
}
function buildAdd(index) {
  const task=ui.buildTask;
  if(!task || task.solved || task.chosen.includes(index) || task.chosen.length>=task.data.word.length) return;
  task.chosen.push(index);
  task.participated=true;
  render();
}
function buildCheck() {
  const t=ui.buildTask;
  if(!t || t.solved || t.chosen.length!==t.data.word.length) return;
  const attempt=t.chosen.map(i=>t.tiles[i]).join('').toLowerCase();
  if(attempt===t.data.word) {
    t.solved=true;t.participated=true;t.counted=true;
    if(t.hints || t.errors) t.assisted=t.hints>0;
    discoverWord(t.data.word);
    recordIndependentSolve(t.hints===0 && t.errors===0);
    completedRound();
    playSound('good');
    render();
    toast('Du fant ordet! ✨');
  } else {
    t.errors++;t.participated=true;
    // Vi lar elevens bokstaver stå. Ingen fremgang fjernes.
    if(t.errors>=2) t.hints=Math.max(t.hints,1);
    setFeedback('#build-feedback',t.hints?buildHintText(t):'Nesten! Prøv å bytte en bokstav. 🌱');
  }
}
function buildHint() {
  const t=ui.buildTask; if(!t || t.solved) return;
  t.participated=true;
  t.hints=Math.min(3,t.hints+1);
  setFeedback('#build-feedback',buildHintText(t));
}
function discoverWord(word) {
  if(!state.discovered.includes(word)) state.discovered.push(word);
  saveState();
}
function successHTML(word,assisted,nextAction) {
  return `<div class="success-burst" aria-hidden="true">✨🌼✨</div>
    <div class="task-sup">ET ORD Å VÆRE STOLT AV</div>
    <div class="success-word">${escapeHTML(textWord(word))}</div>
    <p class="task-help">${assisted?'Du fant ordet med hjelp. Sånn lærer vi!':'Se hva du fant!'}</p>
    ${newCreaturePrompt()}
    <div class="task-actions">
      <button class="btn btn-outline" data-action="success-hear" data-word="${escapeHTML(word)}">🔊 Hør ordet</button>
      <button class="btn btn-primary" data-action="${nextAction}">Neste ord →</button>
    </div>`;
}

// ────────────────────────────────────────────────────────────────────────────
// 6. ORDJAKT – FINN ORDET SOM PASSER TIL BILDET
// Ingen klokke eller poengtap. Ved vansker kommer et hint, ikke et nederlag.
// ────────────────────────────────────────────────────────────────────────────
function startHuntTask(advance=true) {
  if(advance) state.sessions.hunt++;
  const list=taskList();
  const data=list[state.sessions.hunt % list.length];
  let distractors=list.filter(w=>w.word!==data.word);
  distractors.sort((a,b)=>Math.abs(a.word.length-data.word.length)-Math.abs(b.word.length-data.word.length));
  // Bruk først og fremst ord med lik lengde for en reell lesesammenligning.
  const shortList=distractors.slice(0,Math.max(4,Math.ceil(distractors.length/2)));
  ui.huntTask={data,options:shuffle([data.word,...shuffle(shortList).slice(0,2).map(t=>t.word)]),tried:[],hints:0,solved:false,participated:false,counted:false};
  saveState();
}
function huntHTML() {
  const t=ui.huntTask;
  return `<section class="activity-shell">
    ${activityHeader('ORDJAKT','Finn ordet','Se på bildet. Hvilket ord passer?')}
    <div class="activity-panel task-card">
      ${t.solved ? successHTML(t.data.word,false,'hunt-next') : `
      <div class="task-sup">SE OG VELG</div>
      <div class="task-emoji" aria-label="${escapeHTML(t.data.word)}">${t.data.emoji}</div>
      <h2 class="task-prompt">Finn ordet!</h2>
      <div class="word-choices">
      ${t.options.map(word=>`<button class="word-choice ${t.tried.includes(word)?'just-tried':''} ${t.hints>=2&&word===t.data.word?'revealed':''}"
        data-action="hunt-choice" data-word="${escapeHTML(word)}">${escapeHTML(textWord(word.toLowerCase()))}</button>`).join('')}
      </div>
      <div class="task-actions">
        <button class="btn btn-outline" data-action="hunt-hear">🔊 Hør</button>
        <button class="btn btn-sun" data-action="hunt-hint">💡 Hint</button>
        <button class="btn btn-outline" data-action="hunt-next">Et annet ord →</button>
      </div>
      <div id="hunt-feedback" class="help-inline" aria-live="polite">${t.hints?huntHintText(t):' '}</div>
      `}
    </div>
  </section>`;
}
function huntHintText(task) {
  return task.hints>=2?'Se på ordet med den grønne rammen.':`Ordet begynner med ${showLetter(task.data.word[0])}.`;
}
function huntChoose(word) {
  const t=ui.huntTask; if(!t || t.solved) return;
  if(word===t.data.word) {
    t.solved=true;t.participated=true;t.counted=true;discoverWord(word);recordIndependentSolve(t.hints===0 && t.tried.length===0);completedRound();playSound('good');render();toast('Du fant ordet! 🌼');
  } else {
    t.participated=true;
    if(!t.tried.includes(word)) t.tried.push(word);
    if(t.tried.length>=2) t.hints=Math.max(t.hints,2);
    render();
    setFeedback('#hunt-feedback',t.hints?huntHintText(t):'Prøv et av de andre ordene. 🌱');
  }
}
function huntHint() {
  const t=ui.huntTask; if(!t || t.solved) return;
  t.participated=true;
  t.hints=Math.min(2,t.hints+1);render();
}

// ────────────────────────────────────────────────────────────────────────────
// 7. BOKSTAVHAGEN – EN ROLIG LEK UTEN EKSTRA STRESS
// Store og små bokstaver finner hverandre. Bokstavene er likeverdige.
// ────────────────────────────────────────────────────────────────────────────
const GARDEN_LETTERS=['A','M','S','O','L','I','Y','E','B','R','U','T','Æ','Ø','Å','K'];
function startGardenTask(advance=true) {
  if(advance) state.sessions.garden++;
  const letter=GARDEN_LETTERS[state.sessions.garden % GARDEN_LETTERS.length];
  const others=shuffle(GARDEN_LETTERS.filter(x=>x!==letter)).slice(0,2);
  ui.gardenTask={letter,options:shuffle([letter,...others]),solved:false,tries:0,participated:false,counted:false};
  saveState();
}
function gardenHTML() {
  const t=ui.gardenTask;
  const flowers=state.garden.slice(-8).map(l=>`<span title="${escapeHTML(l)}" aria-label="Blomst med ${escapeHTML(l)}">🌼</span>`).join('');
  return `<section class="activity-shell">
    ${activityHeader('BOKSTAVHAGEN','Rolig bokstavlek','Finn den lille bokstaven som passer til den store.')}
    <div class="activity-panel garden-panel">
      ${t.solved ? `<div class="success-burst">🌷</div>
        <h2 class="task-prompt">Bokstaven fant en venn!</h2>
        <div class="success-word">${t.letter} ${t.letter.toLowerCase()}</div>
        ${newCreaturePrompt()}
        <button class="btn btn-primary" data-action="garden-next">Plant en til →</button>`:
      `<div class="task-sup">SE ETTER VENNEN</div>
        <div class="garden-plot"><div class="garden-flower" aria-label="Stor bokstav ${t.letter}">${t.letter}</div></div>
        <div class="garden-options">
          ${t.options.map(l=>`<button class="garden-option ${t.tries>=2&&l===t.letter?'revealed':''}"
            data-action="garden-choice" data-letter="${l}" aria-label="Liten bokstav ${l.toLowerCase()}">${l.toLowerCase()}</button>`).join('')}
        </div>
        <div class="task-actions"><button class="btn btn-outline" data-action="garden-hear">🔊 Hør</button>
          <button class="btn btn-outline" data-action="garden-next">En annen →</button></div>
        <div id="garden-feedback" class="help-inline" aria-live="polite"></div>`}
      <div class="section-label" style="margin:22px 0 11px">Blomstene dine</div>
      <div class="garden-grown" aria-label="Blomster du har plantet">${flowers || '🌱'}</div>
    </div>
  </section>`;
}
function gardenChoose(letter) {
  const t=ui.gardenTask;if(!t || t.solved) return;
  if(letter===t.letter){
    t.solved=true;t.participated=true;t.counted=true;
    state.garden.push(letter);
    if(state.garden.length>100) state.garden.shift();
    completedRound();playSound('good');render();
  } else {
    t.tries++;t.participated=true;
    if(t.tries>=2) render();
    setFeedback('#garden-feedback','Prøv en annen. Her er det ingen hast! 🌿');
  }
}

// En elev kan ha jobbet med oppgaven uten å finne rett svar. Hvis eleven
// trykker «Et annet ord» etter å ha prøvd eller lyttet, er det likevel en
// fullført lekerunde. Vi teller bare én gang – og aldri ved tom skipping.
function nextActivity(kind) {
  const tasks={build:ui.buildTask,hunt:ui.huntTask,garden:ui.gardenTask};
  const task=tasks[kind];
  if(task?.participated && !task.counted) {
    task.counted=true;
    recordIndependentSolve(false);
    completedRound();
  }
  if(kind==='build')startBuildTask();
  if(kind==='hunt')startHuntTask();
  if(kind==='garden')startGardenTask();
  render();
}

// ────────────────────────────────────────────────────────────────────────────
// 7B. BOKSTAVLABBEN – TRE NYE SORTERINGSLEKER
// Alle sorteringsoppgaver bruker den samme oppskriften:
//  1) Hent en oppgave fra valgt nivå.
//  2) Vis få, store valg og la eleven angre.
//  3) Gi hint – aldri minuspoeng eller tap av dinosaurer.
// Det er bevisst ikke dra-og-slipp: trykk er enklere på iPad, mus og tastatur.
// ────────────────────────────────────────────────────────────────────────────
const SORT_SET = {
  'alphabet-letters': {
    1:['ABC','KLM','RST','ÆØÅ'],
    2:['LMNO','BCDE','PQRS','XYZÆ'],
    3:['KLMNT','PQRST','ÆØÅYZ','ABCDE'],
    4:['KLMNRT','ABDFGH','RSUVXY','MNOPÆÅ'],
    5:['ABCÆØÅ','KLNRÆØÅ','STUVÆØÅ','OPRXYZÆ']
  },
  'alphabet-words': {
    1:[['sol','bil','mus'],['rev','hus','katt'],['is','lam','ost']],
    2:[['skje','båt','melk','fisk'],['seng','ball','rev','ost'],['hus','bil','sol','tann']],
    3:[['bok','bil','mat','mus'],['sol','sopp','hus','hest'],['fisk','fjell','mat','måne']],
    4:[['mat','melk','mus','måne'],['bak','bil','bok','båt'],['sol','sopp','sky','sykkel']],
    5:[['sag','sal','sand','sang'],['ball','bamse','bane','bar'],['bak','ball','bamse','barn'],['hus','husk','huset','hytte']]
  }
};
function norwegianCompare(a,b){return a.localeCompare(b,'nb-NO');}
function sortingTarget(task){
  if(task.kind==='alphabet-letters')return [...task.items].sort((a,b)=>LETTERS.indexOf(a)-LETTERS.indexOf(b));
  return [...task.items].sort(norwegianCompare);
}
function startSortTask(kind,advance=true){
  const session={ 'letter-sort':'letterSort','alphabet-letters':'alphabetLetters','alphabet-words':'alphabetWords'}[kind];
  if(!session)return;
  if(advance)state.sessions[session]++;
  const level=state.settings.level;
  let items=[];
  if(kind==='letter-sort'){
    // Nivået bestemmer antallet; vokalene inkluderer Y og Æ Ø Å.
    const count=[0,4,5,6,7,8][level];
    const vowelCount=Math.ceil(count/2);
    const vowels=shuffle([...VOWELS]);
    const consonants=shuffle(LETTERS.filter(l=>!isVowel(l)));
    items=shuffle([...vowels.slice(0,vowelCount),...consonants.slice(0,count-vowelCount)]);
  }else if(kind==='alphabet-letters'){
    const bank=SORT_SET[kind][level];
    items=bank[state.sessions[session]%bank.length].split('');
  }else{
    const bank=SORT_SET[kind][level];
    items=[...bank[state.sessions[session]%bank.length]];
  }
  const ordered=sortingTarget({kind,items});
  items=shuffle(items);
  if(items.join('|')===ordered.join('|') && items.length>1)items.reverse();
  ui.sortTask={kind,items,chosen:[],placed:[],selected:null,solved:false,
    participated:false,counted:false,hints:0,errors:0};
  saveState();
}
function labHTML(){
  return `<section class="activity-shell lab-shell">
    ${activityHeader('BOKSTAVLABBEN','Bokstavlabben 🔤','Velg en liten sorteringslek.')}
    <div class="lab-grid">
      <button class="lab-card lab-redblue" data-action="go-letter-sort"><span class="lab-icon">🔴 🔵</span><strong>Bokstavrot</strong><small>Vokaler og konsonanter</small></button>
      <button class="lab-card lab-letters" data-action="go-alphabet-letters"><span class="lab-icon">🔤</span><strong>Bokstavrekke</strong><small>Sett bokstavene i riktig rekkefølge</small></button>
      <button class="lab-card lab-words" data-action="go-alphabet-words"><span class="lab-icon">📚</span><strong>Ord i rekke</strong><small>Sorter ord etter alfabetet</small></button>
    </div>
    <p class="lab-note">💡 Du kan velge nivå inne i hver lek.</p>
  </section>`;
}
function sortHTML(){
  const t=ui.sortTask;
  if(!t)return labHTML();
  const isBins=t.kind==='letter-sort';
  const label=isBins?'BOKSTAVROT':t.kind==='alphabet-letters'?'BOKSTAVREKKE':'ORDREKKE';
  const title=isBins?'Finn riktig bås!':t.kind==='alphabet-letters'?'Sett bokstavene i rekke!':'Sett ordene i rekke!';
  const intro=isBins?'Trykk på en bokstav. Velg så rød eller blå bås.':'Trykk i den rekkefølgen du vil ha dem.';
  if(t.solved)return `<section class="activity-shell">
    ${activityHeader(label,title)}<div class="activity-panel task-card sort-panel">
    <div class="success-burst">🌟 🦕 🌟</div><h2 class="task-prompt">Du fant rekkefølgen!</h2>
    <p class="sort-solution">${t.kind==='letter-sort'?'🔴 + 🔵':sortingTarget(t).map(v=>escapeHTML(textWord(v))).join('  ·  ')}</p>
    ${newCreaturePrompt()}
    <div class="task-actions"><button class="btn btn-primary" data-action="sort-next">En til →</button>
    <button class="btn btn-outline" data-action="go-lab">Bytt lek</button></div></div></section>`;
  const choices=t.items.map((value,i)=>{
    const used=isBins?t.placed.includes(i):t.chosen.includes(i);
    const chosen=isBins?t.selected===i:false;
    const tile=`<button class="sort-tile ${chosen?'selected':''} ${used?'is-used':''} ${isBins?(isVowel(value)?'sort-vowel':'sort-consonant'):''}"
      data-action="${isBins?'sort-pick':'sort-choose'}" data-index="${i}" ${used?'disabled':''}
      aria-label="${isBins?'Velg bokstaven':'Legg til'} ${escapeHTML(value)}" aria-pressed="${chosen?'true':'false'}">${escapeHTML(textWord(value))}</button>`;

        <button class="btn btn-primary" data-action="sort-check" ${t.chosen.length!==t.items.length?'disabled':''}>✓ Sjekk</button>`}
        <button class="btn btn-sun" data-action="sort-hint">💡 Hint</button>
        <button class="btn btn-outline" data-action="sort-next">En annen →</button>

}
function sortPick(index){
  const t=ui.sortTask;if(!t || t.kind!=='letter-sort' || t.placed.includes(index))return;
  t.selected=index;t.participated=true;
  render();
}
function sortBin(bin){
  const t=ui.sortTask;if(!t || t.kind!=='letter-sort' || t.selected===null)return;
  const correct=isVowel(t.items[t.selected])?'vowel':'consonant';
  t.participated=true;
  if(correct===bin){
    t.placed.push(t.selected);t.selected=null;playSound('collect');
    if(t.placed.length===t.items.length)finishSort();
    else render();
  }else{
    t.errors++;recordIndependentSolve(false);playSound('gentle');
    setFeedback('#sort-feedback','Se på bokstaven igjen. Prøv den andre båsen. 🌱');
  }
}
function sortChoose(index){
  const t=ui.sortTask;
  if(!t || t.kind==='letter-sort'||t.chosen.includes(index))return;
  t.chosen.push(index);t.participated=true;
  render();
}
function sortUndo(){
  const t=ui.sortTask;if(!t || t.kind==='letter-sort')return;
  t.chosen.pop();render();
}
function sortCheck(){
  const t=ui.sortTask;if(!t || t.kind==='letter-sort'||t.chosen.length!==t.items.length)return;
  const proposed=t.chosen.map(i=>t.items[i]);
  if(proposed.join('|')===sortingTarget(t).join('|'))finishSort();
  else{
    t.errors++;t.participated=true;recordIndependentSolve(false);
    playSound('gentle');
    setFeedback('#sort-feedback','Noen må bytte plass. Angre og prøv igjen! 🌱');
  }
}
function sortHear(index){
  const t=ui.sortTask;
  if(!t || t.kind!=='alphabet-words' || !t.items[index])return;
  t.participated=true;
  speakWord(t.items[index]);
}
function sortHint(){
  const t=ui.sortTask;if(!t || t.solved)return;
  t.hints++;t.participated=true;
  const tip=t.kind==='letter-sort'?'Vokaler: A E I O U Y Æ Ø Å.':
    t.kind==='alphabet-letters'?`Den første bokstaven er ${textWord(sortingTarget(t)[0])}.`:
    `Første ord er ${textWord(sortingTarget(t)[0])}. Ved lik første bokstav ser du på den andre.`;
  setFeedback('#sort-feedback',tip);
}
function finishSort(){
  const t=ui.sortTask;if(!t || t.solved)return;
  t.solved=true;t.counted=true;
  recordIndependentSolve(t.errors===0&&t.hints===0);
  completedRound();playSound('good');render();
}
function nextSortTask(){
  const t=ui.sortTask;if(!t)return;
  if(t.participated&&!t.counted){t.counted=true;recordIndependentSolve(false);completedRound();}
  startSortTask(t.kind,true);render();
}

// Her krympes bildet på elevens egen enhet før det lagres.
// Det sendes aldri til noen server. Canvas gjør om bildet til JPEG.
function compressImage(file) {
  return new Promise((resolve,reject)=>{
    if(!file || !file.type.startsWith('image/')){reject(new Error('Velg et bilde.'));return;}
    if(file.size>12*1024*1024){reject(new Error('Dette bildet er for stort. Velg et mindre.'));return;}
    const url=URL.createObjectURL(file);
    const image=new Image();
    image.onload=()=>{
      try {
        const max=850;
        const scale=Math.min(1,max/Math.max(image.naturalWidth,image.naturalHeight));
        const canvas=document.createElement('canvas');
        canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));
        canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
        const context=canvas.getContext('2d');
        if(!context)throw new Error('Bildet kunne ikke behandles.');
        context.fillStyle='white';context.fillRect(0,0,canvas.width,canvas.height);
        context.drawImage(image,0,0,canvas.width,canvas.height);
        const data=canvas.toDataURL('image/jpeg',.72);
        URL.revokeObjectURL(url);
        resolve(data);
      }catch(err){URL.revokeObjectURL(url);reject(err);}
    };
    image.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Klarte ikke åpne bildet.'));};
    image.src=url;
  });
}
async function writerPhoto(file) {
  const bookId=ui.bookId,pageIndex=ui.pageIndex;
  try {
    const data=await compressImage(file);
    const b=state.books.find(item=>item.id===bookId);
    if(!b || !b.pages[pageIndex])return;
    const previous=b.pages[pageIndex].image;
    b.pages[pageIndex].image=data;
    if(!saveState()){b.pages[pageIndex].image=previous;return;}
    if(ui.bookId===bookId && ui.pageIndex===pageIndex && ui.screen==='writer')render();
    toast('Bildet er med i boka! 🖼️');
  } catch(err){toast(err.message || 'Kunne ikke legge til bildet.');}
}

function safeFileName(text) {

function downloadFile(name,blob) {

  const a=document.createElement('a');a.href=url;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}

// ────────────────────────────────────────────────────────────────────────────
// 9. TALESYNTESE OG EGNE LYDOPPTAK
// Vi kan velge en norsk systemstemme, men nettleseren bestemmer uttalen.
// «Y» kan derfor få et eget opptak gjort av en voksen. Det gjelder eksakt
// «Y» – og et eget opptak av «LYS» gjelder eksakt «LYS».
// Ingen opptak sendes fra enheten, og elevtekster sendes ikke til Ordøya.
// Merk: enkelte systemstemmer kan ha sine egne nettbaserte lydtjenester.
// ────────────────────────────────────────────────────────────────────────────
let currentAudio=null;
function stopSpeech() {
  if(currentAudio){currentAudio.pause();currentAudio=null;}
  if(voiceSupported())window.speechSynthesis.cancel();
}
function selectedVoice() {
  if(!voiceSupported())return null;
  const voices=window.speechSynthesis.getVoices();
  if(state.settings.voiceURI){
    const selected=voices.find(v=>v.voiceURI===state.settings.voiceURI);
    if(selected)return selected;
  }
  // Norsk bokmål får prioritet. Vi velger ikke en utenlandsk stemme bare
  // fordi den ligger først i listen nettleseren gir oss.
  return voices.find(v=>/^nb[-_]/i.test(v.lang)) ||
         voices.find(v=>/^(nn|no)[-_]/i.test(v.lang)) || null;
}
function normalizedAudioKey(text) {
  return String(text||'').trim().replace(/\s+/g,' ').toLocaleUpperCase('nb-NO');
}
function speak(text) {
  text=String(text||'').trim();
  if(!text){toast('Skriv noe først, så kan du høre det.');return;}
  stopSpeech();
  const recording=state.recordings[normalizedAudioKey(text)];
  if(recording && typeof recording.data==='string' && recording.data.startsWith('data:audio/')) {
    try {
      currentAudio=new Audio(recording.data);
      currentAudio.play().catch(()=>toast('Kunne ikke spille av lydopptaket her.'));
      return;
    }catch(err){console.warn(err);}
  }
  if(!voiceSupported()){toast('Denne nettleseren har ikke talesyntese.');return;}
  const utterance=new SpeechSynthesisUtterance(text);
  utterance.lang='nb-NO';
  utterance.rate=state.settings.speechRate;
  utterance.pitch=1;
  const v=selectedVoice();if(v)utterance.voice=v;
  utterance.onerror=(evt)=>{if(evt.error!=='interrupted' && evt.error!=='canceled')console.warn('Talesyntese:',evt.error);};
  window.speechSynthesis.speak(utterance);
}

// FELLES ORDOPPLESNING FOR ALLE LEKENE.
// Bokstavene eleven samler, er ÉN sammenhengende streng: S+A+L → «sal».
// Vi leser ALDRI hvert bokstavnavn i en løkke her. Nettleseren kan likevel
// *velge å stave* et kort ord (som «sal»), selv om den får korrekt tekst.
// Dette kan ikke tvinges til riktig uttale gjennom vanlig Web Speech API.
// Prioritet: 1) voksenopptak, 2) uttaletekst voksen selv har testet,
// 3) normalt skrevet ord. Ordet på skjermen endres aldri.
function speakWord(word) {
  const pronunciation=String(word||'').trim().toLocaleLowerCase('nb-NO');
  if(!pronunciation)return;
  const key=normalizedAudioKey(pronunciation);
  if(state.recordings[key]) {speak(pronunciation);return;}
  const hint=state.pronunciationHints[key];
  if(typeof hint==='string' && hint.trim())speak(hint.trim());
  else speak(pronunciation);
}

// Et lite uttaleverksted for voksne gjør det mulig å sammenligne stemmer,
// høre nøyaktig hva talemotoren får, og overstyre problemord uten å endre
// elevens skrift. Alternativ uttaletekst MÅ lyttes til før den lagres.
function teacherPronWord() {
  return (document.querySelector('#teacher-pron-word')?.value || '').trim();
}
function teacherPronHint() {
  return (document.querySelector('#teacher-pron-hint')?.value || '').trim();
}
function previewPronHint() {
  const hint=teacherPronHint();
  if(!hint){toast('Skriv en alternativ uttaletekst først.');return;}
  speak(hint);
}
function savePronHint() {
  const word=teacherPronWord(), hint=teacherPronHint();
  if(!word || !hint){toast('Skriv både ordet og uttaleteksten.');return;}
  if(!/^[\p{L}\s-]+$/u.test(word) || word.length>45 || hint.length>100){toast('Bruk et kort ord og kort uttaletekst.');return;}
  const key=normalizedAudioKey(word);
  const previous=state.pronunciationHints[key];
  state.pronunciationHints[key]=hint;
  if(!saveState()){
    if(previous===undefined)delete state.pronunciationHints[key]; else state.pronunciationHints[key]=previous;
    return;
  }
  render();toast(`Uttaletekst for ${key} er lagret. Test at den uttales riktig.`);
}
function deletePronHint(key) {
  delete state.pronunciationHints[normalizedAudioKey(key)];
  saveState();render();toast('Uttaleteksten er fjernet.');
}
function fillVoices() {
  const select=document.querySelector('#teacher-voice');if(!select)return;
  select.replaceChildren();
  const automatic=new Option('Automatisk norsk stemme','');select.add(automatic);
  const voices=voiceSupported()?window.speechSynthesis.getVoices():[];
  const norwegian=voices.filter(v=>/^(nb|nn|no)[-_]/i.test(v.lang));
  const listing=norwegian.length?norwegian:voices;
  listing.forEach(v=>select.add(new Option(`${v.name} (${v.lang})`,v.voiceURI)));
  select.value=listing.some(v=>v.voiceURI===state.settings.voiceURI)?state.settings.voiceURI:'';
  const info=document.querySelector('#teacher-voice-info');
  if(info)info.textContent=(!voiceSupported())?'Talesyntese er ikke tilgjengelig her.':
    norwegian.length?`${norwegian.length} norsk(e) stemme(r) funnet på denne enheten.`:
    'Ingen norsk stemme funnet ennå. Tilgjengeligheten avhenger av enheten.';
}
if(voiceSupported())window.speechSynthesis.addEventListener?.('voiceschanged',fillVoices);
